server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  charset utf-8;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
  etag on;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # HTML, CSS and app JS: always revalidate so updates appear immediately
  location / {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri $uri/ /index.html;
  }

  # vendored three.js and images rarely change: cache for 7 days
  location ~* ^/assets/(vendor|img)/ {
    add_header Cache-Control "public, max-age=604800" always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  location = /healthz { access_log off; add_header Content-Type text/plain; return 200 "ok\n"; }
}
